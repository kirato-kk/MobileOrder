<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Order</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #f5f6fa;
      color: #2f3640;
      user-select: none;
    }
    button {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const playTone = (freq, duration, type = 'sine') => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    };

    const soundEffects = {
      click: () => playTone(600, 0.05),
      add: () => playTone(880, 0.08),
      order: () => {
        playTone(523, 0.08);
        setTimeout(() => playTone(659, 0.08), 80);
        setTimeout(() => playTone(784, 0.12), 160);
      },
      call: () => playTone(1046, 0.15, 'square')
    };

    const menuData = [
      { id: 1, name: { ja: '特製醤油ラーメン', en: 'Shoyu Ramen' }, price: 980, category: 'food', highlight: '人気No.1', allergy: '小麦・大豆', desc: 'コク深いスープ' },
      { id: 2, name: { ja: '黄金チャーハン', en: 'Fried Rice' }, price: 750, category: 'food', highlight: '絶品', allergy: '卵・豚肉', desc: 'パラパラ食感' },
      { id: 3, name: { ja: '生ビール', en: 'Draft Beer' }, price: 550, category: 'drink', highlight: '人気', allergy: 'なし', desc: 'キンキンです' },
      { id: 4, name: { ja: '烏龍茶', en: 'Oolong Tea' }, price: 300, category: 'drink', highlight: '', allergy: 'なし', desc: 'さっぱり' }
    ];

    function MobileOrderApp() {
      const [tableNo] = useState('05');
      const [lang, setLang] = useState('ja');
      const [category, setCategory] = useState('all');
      const [cart, setCart] = useState([]);
      const [myOrders, setMyOrders] = useState([]);
      const [soldOuts, setSoldOuts] = useState([]);
      const [selectedItem, setSelectedItem] = useState(null);
      const [showSplit, setShowSplit] = useState(false);
      const [splitCount, setSplitCount] = useState(2);

      const loadData = () => {
        const savedOrders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
        const savedSoldout = JSON.parse(localStorage.getItem('restaurant_soldout') || '[]');
        setMyOrders(savedOrders.filter(o => o.tableNo === tableNo));
        setSoldOuts(savedSoldout);
      };

      useEffect(() => {
        loadData();
        const timer = setInterval(loadData, 1000);
        window.addEventListener('storage', loadData);
        return () => {
          clearInterval(timer);
          window.removeEventListener('storage', loadData);
        };
      }, [tableNo]);

      const addToCart = (item) => {
        soundEffects.add();
        setCart([...cart, { ...item, cartId: Date.now() }]);
        setSelectedItem(null);
      };

      const submitOrder = () => {
        if (cart.length === 0) return;
        soundEffects.order();

        const totalAmount = cart.reduce((sum, i) => sum + i.price, 0);
        const newOrder = {
          orderId: `ORD_${Date.now()}`,
          tableNo,
          items: cart.map(i => ({ name: i.name[lang], quantity: 1 })),
          totalAmount,
          status: 'pending',
          createdAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
        };

        const existing = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
        localStorage.setItem('restaurant_orders', JSON.stringify([...existing, newOrder]));

        setCart([]);
        loadData();
      };

      const requestCheckout = () => {
        soundEffects.call();
        const total = myOrders.reduce((sum, o) => sum + o.totalAmount, 0);
        const checkouts = JSON.parse(localStorage.getItem('restaurant_checkouts') || '[]');
        checkouts.push({
          tableNo,
          totalAmount: total,
          requestedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
        });
        localStorage.setItem('restaurant_checkouts', JSON.stringify(checkouts));
        alert('お会計の呼び出しを完了しました！');
      };

      const myTotalAmount = myOrders.reduce((sum, o) => sum + o.totalAmount, 0);

      return (
        <div style={{ maxWidth: '480px', margin: '0 auto', padding: '16px' }}>
          <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
            <div>
              <h1 style={{ margin: 0, fontSize: '22px', color: '#e1b12c' }}>📱 Mobile Order</h1>
              <span style={{ fontSize: '12px', fontWeight: 'bold', color: '#718093' }}>卓番: {tableNo} 番卓</span>
            </div>

            <button onClick={() => { soundEffects.click(); setLang(lang === 'ja' ? 'en' : 'ja'); }} style={{ background: '#718093', color: '#fff', padding: '6px 12px', fontSize: '12px' }}>
              🌐 {lang === 'ja' ? 'English' : '日本語'}
            </button>
          </header>

          <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
            <button onClick={() => { soundEffects.call(); alert('お水をリクエストしました！'); }} style={{ flex: 1, background: '#00a8ff', color: '#fff', padding: '8px', fontSize: '12px' }}>💧 お水</button>
            <button onClick={() => { soundEffects.call(); alert('取り皿をリクエストしました！'); }} style={{ flex: 1, background: '#9c88ff', color: '#fff', padding: '8px', fontSize: '12px' }}>🍽️ 取り皿</button>
            <button onClick={() => { soundEffects.click(); setShowSplit(!showSplit); }} style={{ flex: 1, background: '#e84118', color: '#fff', padding: '8px', fontSize: '12px' }}>🧮 割り勘</button>
          </div>

          {showSplit && (
            <div style={{ background: '#fff', padding: '12px', borderRadius: '12px', marginBottom: '16px', border: '2px solid #e84118' }}>
              <div style={{ fontSize: '14px', fontWeight: 'bold' }}>🧮 割り勘計算</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', margin: '8px 0' }}>
                <span>人数:</span>
                <button onClick={() => setSplitCount(Math.max(1, splitCount - 1))} style={{ padding: '4px 8px' }}>-</button>
                <strong>{splitCount}名</strong>
                <button onClick={() => setSplitCount(splitCount + 1)} style={{ padding: '4px 8px' }}>+</button>
              </div>
              <div style={{ fontSize: '16px', fontWeight: 'bold', color: '#e84118' }}>
                1人あたり: 約 ¥{Math.ceil(myTotalAmount / (splitCount || 1)).toLocaleString()}
              </div>
            </div>
          )}

          <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
            {['all', 'food', 'drink'].map(cat => (
              <button key={cat} onClick={() => { soundEffects.click(); setCategory(cat); }} style={{ flex: 1, background: category === cat ? '#e1b12c' : '#718093', color: '#fff', padding: '10px' }}>
                {cat === 'all' ? 'すべて' : cat === 'food' ? '🍳 フード' : '🍺 ドリンク'}
              </button>
            ))}
          </div>

          <div style={{ display: 'grid', gap: '12px', marginBottom: '24px' }}>
            {menuData.filter(m => category === 'all' || m.category === category).map(menu => {
              const isSoldOut = soldOuts.includes(menu.name.ja);

              return (
                <div key={menu.id} style={{ background: '#fff', padding: '14px', borderRadius: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', boxShadow: '0 2px 6px rgba(0,0,0,0.06)' }}>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <strong style={{ fontSize: '16px' }}>{menu.name[lang]}</strong>
                      {menu.highlight && <span style={{ background: '#e84118', color: '#fff', padding: '2px 6px', borderRadius: '6px', fontSize: '10px' }}>{menu.highlight}</span>}
                    </div>
                    <div style={{ fontSize: '12px', color: '#718093', marginTop: '2px' }}>{menu.desc}</div>
                    <div style={{ fontSize: '14px', fontWeight: 'bold', color: '#e1b12c', marginTop: '4px' }}>¥{menu.price}</div>
                  </div>

                  <button disabled={isSoldOut} onClick={() => addToCart(menu)} style={{ background: isSoldOut ? '#718093' : '#e1b12c', color: '#fff', padding: '8px 16px' }}>
                    {isSoldOut ? '完売中' : '追加'}
                  </button>
                </div>
              );
            })}
          </div>

          {cart.length > 0 && (
            <div style={{ background: '#2f3640', color: '#fff', padding: '14px', borderRadius: '12px', marginBottom: '16px' }}>
              <div style={{ fontSize: '14px', fontWeight: 'bold', marginBottom: '8px' }}>🛒 カート ({cart.length}点)</div>
              <button onClick={submitOrder} style={{ width: '100%', background: '#4cd137', color: '#fff', padding: '12px', fontSize: '16px' }}>
                注文を確定する
              </button>
            </div>
          )}

          <div style={{ background: '#fff', padding: '14px', borderRadius: '12px', boxShadow: '0 2px 6px rgba(0,0,0,0.06)' }}>
            <div style={{ fontSize: '14px', fontWeight: 'bold', marginBottom: '8px', color: '#e1b12c' }}>🔄 注文履歴・リアルタイム状況</div>
            {myOrders.length === 0 ? (
              <div style={{ fontSize: '12px', color: '#aaa' }}>まだ注文はありません。</div>
            ) : (
              myOrders.map(order => (
                <div key={order.orderId} style={{ borderBottom: '1px solid #f1f2f6', padding: '8px 0', fontSize: '13px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span>{order.items.map(i => i.name).join(', ')}</span>
                    <strong style={{ color: order.status === 'completed' ? '#4cd137' : order.status === 'preparing' ? '#fbc531' : '#e84118' }}>
                      {order.status === 'completed' ? '✓ 提供完了' : order.status === 'preparing' ? '🍳 調理中' : '⏳ 受付済'}
                    </strong>
                  </div>
                </div>
              ))
            )}

            {myTotalAmount > 0 && (
              <button onClick={requestCheckout} style={{ width: '100%', background: '#e84118', color: '#fff', padding: '12px', marginTop: '12px', fontSize: '15px' }}>
                🔔 お会計を呼ぶ (合計: ¥{myTotalAmount.toLocaleString()})
              </button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MobileOrderApp />);
  </script>
</body>
</html>
