<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モバイルオーダー - ご注文</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #fff9f0;
      color: #4a3b32;
    }
    button {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button:active:not(:disabled) { transform: scale(0.96); }
    
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b6b;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(255,107,107,0.3);
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .tooltip-bubble {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff5252;
      color: white;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      animation: bounce 0.6s infinite alternate;
      z-index: 100;
    }
    .tooltip-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #ff5252 transparent;
      display: block;
      width: 0;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes bounce { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -6px); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRODUCTS = [
      { id: 'item-01', name: '絶品チーズバーガー', price: 680, category: 'main', icon: '🍔' },
      { id: 'item-02', name: '濃厚てりやきバーガー', price: 650, category: 'main', icon: '🍔' },
      { id: 'item-03', name: 'サクサクポテト (L)', price: 380, category: 'side', icon: '🍟' },
      { id: 'item-04', name: '濃厚アイスクリーム', price: 350, category: 'dessert', icon: '🍨' },
      { id: 'item-05', name: 'チョコパフェ', price: 580, category: 'dessert', icon: '🍧' },
      { id: 'item-06', name: '濃厚アイスコーヒー', price: 300, category: 'drink', icon: '🥤' },
      { id: 'item-07', name: 'オレンジジュース', price: 280, category: 'drink', icon: '🍊' },
      { id: 'item-08', name: 'おしぼり追加', price: 0, category: 'other', icon: '🧻' },
    ];

    function CustomerApp() {
      const [cart, setCart] = useState([]);
      const [toast, setToast] = useState('');
      const [showBubble, setShowBubble] = useState(false);
      const [activeTab, setActiveTab] = useState('welcome');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [orderedTotal, setOrderedTotal] = useState(0); // 確定済み注文の合計金額
      const tableNo = 5;

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2000);
      };

      const addToCart = (product) => {
        setCart((prev) => {
          const existing = prev.find((item) => item.id === product.id);
          if (existing) {
            return prev.map((item) => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
        showNotification(`✨ ${product.name} を追加しました！`);
        setShowBubble(true);
      };

      const updateQuantity = (id, delta) => {
        setCart((prev) =>
          prev.map((item) => {
            if (item.id === id) {
              const q = item.quantity + delta;
              return q > 0 ? { ...item, quantity: q } : null;
            }
            return item;
          }).filter(Boolean)
        );
      };

      const submitOrder = () => {
        if (cart.length === 0) return;

        const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const newOrder = {
          orderId: `ORD-${Date.now().toString().slice(-4)}`,
          tableNo,
          items: cart,
          totalAmount: totalAmount,
          status: 'pending',
          createdAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
        };

        const existingOrders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
        localStorage.setItem('restaurant_orders', JSON.stringify([newOrder, ...existingOrders]));

        // 確定済み金額に加算
        setOrderedTotal((prev) => prev + totalAmount);
        setCart([]);
        setShowBubble(false);
        showNotification('🎉 注文を送信しました！');
        setActiveTab('menu');
      };

      const requestCheckout = () => {
        if (orderedTotal === 0) return;

        const checkoutReq = {
          tableNo,
          totalAmount: orderedTotal,
          requestedAt: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }),
          status: 'checkout_requested'
        };
        
        const existingCheckouts = JSON.parse(localStorage.getItem('restaurant_checkouts') || '[]');
        localStorage.setItem('restaurant_checkouts', JSON.stringify([checkoutReq, ...existingCheckouts]));

        alert(`お会計金額: ¥${orderedTotal.toLocaleString()}\n\nお会計リクエストを受け付けました。\n伝票をお持ちの上、レジへお越しください！`);
      };

      const cartItemCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const cartTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      const filteredProducts = selectedCategory === 'all' 
        ? PRODUCTS 
        : PRODUCTS.filter(p => p.category === selectedCategory);

      return (
        <div style={{ maxWidth: '480px', margin: '0 auto', background: '#fff', minHeight: '100vh', boxShadow: '0 0 20px rgba(0,0,0,0.05)', position: 'relative' }}>
          {toast && <div className="toast">{toast}</div>}

          {/* ヘッダー */}
          <header style={{ background: 'linear-gradient(135deg, #ff9f43, #ff5252)', color: '#fff', padding: '16px', textAlign: 'center', borderBottomLeftRadius: '20px', borderBottomRightRadius: '20px' }}>
            <h1 style={{ margin: 0, fontSize: '20px', fontWeight: '800' }}>🍔 MOBILE ORDER</h1>
            <div style={{ fontSize: '13px', marginTop: '4px', opacity: 0.9 }}>テーブル番号: {tableNo}</div>
          </header>

          {/* メインエリア */}
          <main style={{ padding: '20px', paddingBottom: '120px' }}>
            {activeTab === 'welcome' && (
              <div style={{ textAlign: 'center', paddingTop: '20px' }}>
                <h2 style={{ fontSize: '24px', color: '#ff6b6b', marginBottom: '8px' }}>いらっしゃいませ！✨</h2>
                <p style={{ color: '#666', fontSize: '14px', marginBottom: '32px' }}>カテゴリを選んでご注文を開始してください</p>
                
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <button onClick={() => { setSelectedCategory('main'); setActiveTab('menu'); }} style={{ background: '#ffeaa7', padding: '24px 12px', fontSize: '18px', color: '#d63031' }}>
                    🍔 メイン
                  </button>
                  <button onClick={() => { setSelectedCategory('dessert'); setActiveTab('menu'); }} style={{ background: '#ffcaa6', padding: '24px 12px', fontSize: '18px', color: '#e17055' }}>
                    🍨 デザート
                  </button>
                  <button onClick={() => { setSelectedCategory('drink'); setActiveTab('menu'); }} style={{ background: '#81ecec', padding: '24px 12px', fontSize: '18px', color: '#00cec9' }}>
                    🥤 ドリンク
                  </button>
                  <button onClick={() => { setSelectedCategory('other'); setActiveTab('menu'); }} style={{ background: '#dfe6e9', padding: '24px 12px', fontSize: '18px', color: '#636e72' }}>
                    ✨ その他
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'menu' && (
              <div>
                <div style={{ display: 'flex', gap: '8px', overflowX: 'auto', paddingBottom: '12px', marginBottom: '16px' }}>
                  {[
                    { id: 'all', label: 'すべて' },
                    { id: 'main', label: 'メイン' },
                    { id: 'dessert', label: 'デザート' },
                    { id: 'drink', label: 'ドリンク' },
                    { id: 'other', label: 'その他' }
                  ].map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => setSelectedCategory(cat.id)}
                      style={{
                        padding: '6px 14px',
                        fontSize: '13px',
                        background: selectedCategory === cat.id ? '#ff6b6b' : '#f1f2f6',
                        color: selectedCategory === cat.id ? '#fff' : '#2f3640',
                        whiteSpace: 'nowrap'
                      }}
                    >
                      {cat.label}
                    </button>
                  ))}
                </div>

                {filteredProducts.map((product) => (
                  <div key={product.id} style={{ display: 'flex', alignItems: 'center', background: '#fff9f0', padding: '14px', borderRadius: '16px', marginBottom: '12px', border: '1px solid #ffeaa7' }}>
                    <span style={{ fontSize: '32px', marginRight: '12px' }}>{product.icon}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 'bold' }}>{product.name}</div>
                      <div style={{ color: '#ff5252', fontWeight: 'bold' }}>¥{product.price.toLocaleString()}</div>
                    </div>
                    <button onClick={() => addToCart(product)} style={{ background: '#ff9f43', color: '#fff', padding: '8px 16px', fontSize: '14px' }}>
                      追加
                    </button>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'cart' && (
              <div>
                <h2 style={{ fontSize: '18px', color: '#ff6b6b', marginTop: 0 }}>カートの確認</h2>
                {cart.length === 0 ? (
                  <p style={{ textAlign: 'center', color: '#aaa', marginTop: '40px' }}>カートは空です 🛒</p>
                ) : (
                  <div>
                    {cart.map((item) => (
                      <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #eee', padding: '12px 0' }}>
                        <div>
                          <div style={{ fontWeight: 'bold' }}>{item.name}</div>
                          <div style={{ color: '#888', fontSize: '13px' }}>¥{item.price.toLocaleString()}</div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <button onClick={() => updateQuantity(item.id, -1)} style={{ background: '#eee', color: '#333', width: '28px', height: '28px' }}>-</button>
                          <span style={{ fontWeight: 'bold' }}>{item.quantity}</span>
                          <button onClick={() => updateQuantity(item.id, 1)} style={{ background: '#eee', color: '#333', width: '28px', height: '28px' }}>+</button>
                        </div>
                      </div>
                    ))}
                    <div style={{ marginTop: '24px', textAlign: 'right', fontSize: '20px', fontWeight: '800', color: '#ff5252' }}>
                      小計: ¥{cartTotal.toLocaleString()}
                    </div>
                    <button onClick={submitOrder} style={{ width: '100%', background: '#ff5252', color: '#fff', padding: '14px', fontSize: '16px', marginTop: '16px', boxShadow: '0 4px 12px rgba(255,82,82,0.3)' }}>
                      注文を確定する
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 固定フッター */}
          <footer style={{ position: 'fixed', bottom: 0, width: '100%', maxWidth: '480px', background: '#fff', borderTop: '2px solid #ffeaa7', display: 'flex', gap: '8px', padding: '10px 16px', boxSizing: 'border-box' }}>
            <button onClick={() => setActiveTab('menu')} style={{ flex: 1, padding: '10px', background: activeTab === 'menu' ? '#ffeaa7' : '#f5f5f5', color: '#4a3b32' }}>
              メニュー
            </button>
            
            <div style={{ flex: 1, position: 'relative' }}>
              {showBubble && activeTab !== 'cart' && (
                <div className="tooltip-bubble">確定を押してください！</div>
              )}
              <button 
                onClick={() => { setActiveTab('cart'); setShowBubble(false); }} 
                style={{ width: '100%', height: '100%', padding: '10px', background: activeTab === 'cart' ? '#ffeaa7' : '#f5f5f5', color: '#4a3b32' }}
              >
                カート {cartItemCount > 0 && <span style={{ background: '#ff5252', color: '#fff', borderRadius: '10px', padding: '2px 6px', fontSize: '11px', marginLeft: '4px' }}>{cartItemCount}</span>}
              </button>
            </div>

            <button 
              onClick={requestCheckout} 
              disabled={orderedTotal === 0}
              style={{ flex: 1, padding: '10px', background: '#54a0ff', color: '#fff' }}
            >
              お会計
            </button>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CustomerApp />);
  </script>
</body>
</html>
